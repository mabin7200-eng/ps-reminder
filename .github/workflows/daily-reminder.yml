name: Daily WhatsApp Reminder — 4AM IST

on:
  schedule:
    # 4:00 AM IST = 10:30 PM UTC (previous day)
    - cron: '30 22 * * *'
  workflow_dispatch: # Manual trigger for testing

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Send Daily WhatsApp Reminder
        env:
          WA_TOKEN:              ${{ secrets.WA_TOKEN }}
          WA_PHONE_ID:           ${{ secrets.WA_PHONE_ID }}
          WA_TO_NUMBER:          ${{ secrets.WA_TO_NUMBER }}
          WA_TEMPLATE:           ${{ secrets.WA_TEMPLATE }}
          FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY:  ${{ secrets.FIREBASE_PRIVATE_KEY }}
          FIREBASE_USER_UID:     ${{ secrets.FIREBASE_USER_UID }}
        run: node notify.js
